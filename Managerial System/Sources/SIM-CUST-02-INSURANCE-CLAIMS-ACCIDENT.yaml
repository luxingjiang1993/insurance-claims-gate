evidence_notes:
  regulatory:
    - source: "中国人大网公开《中华人民共和国保险法》文本"
      points:
        - "第22条：资料不完整应及时一次性通知补正"
        - "第23条：及时核定；复杂情形三十日；协议后十日给付"
        - "第24条：拒赔通知书三日并说明理由"
        - "第26条：非寿险请求时效二年等"
      urls:
        - "http://www.npc.gov.cn/zgrdw/npc/xinwen/lfgz/zxfl/2009-02/28/content_1476572.htm"
  industry_public:
    - source: "《中国消费者报》对保险理赔数字化痛点与趋势的报道（引用中国人民大学保险研究所相关报告观点）"
      points:
        - "痛点：用户认知门槛高、流程繁杂、标准笼统；趋势：在线化、智能化、前置化"
        - "披露多家公司小额/整体理赔时效与线上化率等公开数据，抬高客户预期"
