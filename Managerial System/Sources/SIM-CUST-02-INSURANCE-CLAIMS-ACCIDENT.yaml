section: golden_eval_spec
status: FILLED
related_requirements: [REQ-M-05, REQ-S-05, REQ-S-04]

design_principles:
  - "专家金标优先于众包；持续基准优先于一次性 demo（企业 gold-standard evaluation 公开共识）"
  - "分段评测：按失败模式看，不看单一总分（公开 RAG/垂直 agent 实践）"
  - "不假设前沿模型在保险垂直任务上自然高分：Snorkel×CPCU 承保 agent 基准显示任务准确率可从约 0.78（Deductibles）降到约 0.38（Product Recommendations）量级分化"

corpus:
  pilot_gold_size: "约 300 件（最低验收门槛）；争取 400–500 件覆盖长尾"
  size_rationale: |
    垂直试点常见以「专家标注金标 + 分层抽样」支撑 pilot→量产决策（Sixfold 等公开强调 pilot 阶段 accuracy benchmarks）。
    300 件量级可在 7 个主分型上各保留足够样本，同时适合中型公司 2–3 名资深核赔双周标注负荷。
    不编造「已有内部 300 件」——启动后由历史已决案脱敏抽样新建。
  labeling:
    annotators: "资深核赔双人独立标注 + 第三人裁决分歧"
    forbidden: "禁止用模型自标自测作为唯一金标"
  stratification:
    - id: G-SUPPLEMENT
      name: "材料不齐→一次性补件"
      share_pct: 20
      must_assertions: ["材料清单完整", "无拆轮重复索要同一缺失项"]
    - id: G-PAY
      name: "通赔建议（权限内）"
      share_pct: 20
      must_assertions: ["责任成立引用", "金额步骤可复核"]
    - id: G-DEDUCT
      name: "免赔额/比例减赔"
      share_pct: 15
      must_assertions: ["免赔扣除", "比例计算", "条款引用"]
    - id: G-EXCL
      name: "除外/非意外（疾病vs意外等）"
      share_pct: 20
      must_assertions: ["除外条款项引用", "裁决类型=拒赔草案或调查中"]
    - id: G-ENDORSE
      name: "批单/特约覆盖主险冲突"
      share_pct: 10
      must_assertions: ["效力层级正确", "引用落在优先生效文本"]
    - id: G-INVEST
      name: "调查中冻决"
      share_pct: 10
      must_assertions: ["冻决出款就绪", "调查触发可审计"]
    - id: G-DENY-CITE
      name: "拒赔 citation 完整性"
      share_pct: 5
      must_assertions: ["版本+条款项+说明理由字段齐全"]

pass_bars:
  critical_assertion_pass_rate: "≥95%（G-SUPPLEMENT / G-DEDUCT / G-EXCL / G-ENDORSE / G-DENY-CITE 的关键断言）"
  citation_coverage_on_deny_reduce: "抽检 100% 具备条款级引用（对齐消保举证与保险法第24条说明理由义务）"
  overall_decision_type_accuracy: "≥90%（允许边界案进人闸，不计作自动结案成功）"
  honesty_note: |
    关键断言高门槛用于「可自动推进」路径；整体裁决类型允许低于关键断言，
    因为公开垂直基准已表明模型在保险多步推理上并不均匀高分——不足处置为人人闸，而非放宽门禁。

regression_ops:
  cadence: "每周固定回归"
  weekly_subset_size: "80–100 件（覆盖全部分型）"
  full_gold_rerun: "条款新版本入库或规则变更后全量重跑"
  escape_defect_handling: "生产逃逸缺陷 48h 内入库金标并开 fix Mission"
  autonomy_rule: "未达 pass_bars 不得提高直通比例 / 不得扩大险种"

section: adjuster_workflow
status: FILLED
related_requirements: [REQ-S-06, REQ-M-07, REQ-S-01]
flow_source: |
  对齐公开人身/寿险理赔环节（报案→立案→初审→调查→理算→复核审批→结案）
  与财险「签收审核单证→理算复核→审批→赔付结案」实务；本表裁剪为意外险个人险作业，不含车险查勘定损主链。

screens:
  - step: 1
    name: "报案/立案只读"
    actor: "系统自动 / 内勤"
    user_sees: "保单摘要、险别、生效日、批单标志、历史出险"
    system_action: "L1 拉取核心+理赔案件头；写入 ledger.case_id"
    next_state: "材料受理中"
  - step: 2
    name: "材料受理工作台"
    actor: "核赔初审 / 作业中心"
    user_sees: "OCR 字段、影像缩略图、必传清单红绿灯"
    system_action: "Router→OCR+材料断言；不齐则裁决类型=补件并一次性回写清单"
    next_state: "待补件 | 初审中"
    legal_anchor: "保险法第22条一次性通知补正"
  - step: 3
    name: "责任与除外审阅"
    actor: "核赔员"
    user_sees: "除外命中候选、疾病vs意外争议点、条款 citation 草稿"
    system_action: "Router→条款 RAG；输出通赔建议/减赔/拒赔草案/调查中"
    next_state: "理算中 | 调查中 | 人闸队列"
  - step: 4
    name: "理算复核"
    actor: "理算/核赔"
    user_sees: "免赔扣除、赔付比例、计算步骤、与规则引擎对照差"
    system_action: "Router→规则/算术断言；冲突则 fail-closed"
    next_state: "待核赔审批"
  - step: 5
    name: "人闸队列"
    actor: "主管/授权核赔"
    user_sees: "草案、引用、Validator 报告、风险标签"
    system_action: "approve/reject/escalate；无令牌不出款就绪"
    next_state: "出款就绪 | 驳回修改 | 调查中"
  - step: 6
    name: "对外通知缮制"
    actor: "核赔员"
    user_sees: "补件通知 / 拒赔通知书草稿（含条款依据）"
    system_action: "导出可编辑文书；记录发送回执字段"
    next_state: "已通知"
    legal_anchor: "拒赔：保险法第24条三日通知并说明理由"
  - step: 7
    name: "结案（L2）"
    actor: "系统 + 核心既有支付"
    user_sees: "门禁通过标志；支付仍在核心人工/既有流程触发"
    system_action: "回写结案意见；L3 出款不在本期自动触发"
    next_state: "已结案"

demo_must_walkthrough:
  - "缺发票→补件清单一次给出→客户补传→重跑变通赔建议"
  - "疾病导致摔伤争议→除外 citation→拒赔草案进人闸→可驳回转申诉工单"
  - "批单缩小责任→效力栈引用优先生效文本→减赔"

section: outcome_targets
status: FILLED
related_requirements: [REQ-S-04]
measurement_policy: |
  禁止把头部公司公开广告值写成我司基线。
  试点 Week1–4：用真实作业日志与抽检测定基线；Week5 锁定目标；Week12 做扩面决策。
  下列「公开天花板/压力值」仅作对标，来源见 evidence_notes。

metrics:
  - metric_id: OUT-01
    name: "材料一次交对率"
    public_anchor: "行业「好理赔」讨论指标；微保等公开宣传数字化后约 90%"
    baseline_method: "连续4周：首次提交即满足必传清单的案件占比"
    target_rule: "相对基线 +10～20 个百分点，且不超过公开宣传上限的承诺；未测基线前不签对赌"
    maps_to_pain: "多次补件 / 保险法一次性通知"
  - metric_id: OUT-02
    name: "二次补件率"
    public_anchor: "消费者侧高频投诉点：材料要求不合理、一次不说完（保司公开策略文亦承认此类服务纠纷）"
    baseline_method: "同案≥2 次补件通知占比"
    target_rule: "相对基线下降 ≥30%（相对降幅）"
    maps_to_pain: "反复补件"
  - metric_id: OUT-03
    name: "材料齐全到责任草案耗时（简单案）"
    public_anchor: "行业分析指出大量耗时在文件登记与核验，而非最终决策本身；头部寿险公开整体时效可至亚日级（对标压力）"
    baseline_method: "作业中心简单意外医疗案：材料齐→首版裁决草案中位耗时"
    target_rule: "中位耗时相对基线缩短 20%～40%"
    maps_to_pain: "骨干时间被简易案占用"
  - metric_id: OUT-04
    name: "拒赔/减赔可追溯率"
    public_anchor: "保险法第24条说明理由；消保监管评价抽查证据链"
    baseline_method: "抽检对外拒赔/减赔文书含条款版本+条款项的比例"
    target_rule: "抽检 100%"
    maps_to_pain: "说不清依据"
  - metric_id: OUT-05
    name: "人闸命中率（应闸必闸）"
    public_anchor: "内控与持牌责任不转移；公开智能理赔亦区分小额快赔与复杂人审"
    baseline_method: "拒赔/通融/超阈值/调查解除冻决进入人闸的占比"
    target_rule: "应闸类型 100%"
    maps_to_pain: "越权出款/不当自动拒赔"
  - metric_id: OUT-06
    name: "Golden 关键断言通过率"
    public_anchor: "企业 AI gold-standard eval；垂直保险 agent 公开基准显示任务分数并不均匀"
    baseline_method: "见 golden_eval_spec"
    target_rule: "关键断言 ≥95% 方可提高直通"
    maps_to_pain: "demo 无法过内审"

outcome_pricing_hint: |
  若需 outcome 对价（design partner 商务），建议绑定 OUT-01/OUT-02/OUT-04 的相对改进与可审计交付物，
  而非绑定「秒赔率」或头部公司绝对时效——后者依赖直付数据源与险种结构，中型财险意外险试点不可照搬。

section: router_table
status: FILLED
related_requirements: [REQ-S-07]
principle: "结构化走规则；条款语义走 RAG；影像字段走 OCR；风险线索走调查；高风险走人人闸"

routes:
  - route_id: R-OCR
    when: "发票/病历/费用清单等影像需结构化字段"
    primary: "既有 OCR/影像服务"
    fallback: "人工录入；不调用条款生成字段"
    writes: "structured_fields.*"
  - route_id: R-RULES
    when: "免赔额、赔付比例、金额权限、重复索赔黑名单、等待期天数等可字段化规则"
    primary: "规则引擎 / SQL 断言"
    fallback: "fail-closed → 人审"
    writes: "assertions.deductible|ratio|authority"
  - route_id: R-RAG-CLAUSE
    when: "保险责任、除外、意外定义、批单/特约效力冲突、拒赔理由生成"
    primary: "版本化条款 RAG（retrieval_profile=clause_v_current）"
    fallback: "扩大检索至手册；仍不足则调查中或人闸"
    writes: "citations[] + decision_draft"
  - route_id: R-INVEST
    when: "规则引擎风险分超阈 / 发票验真失败 / 短期重复索赔 / 事故真实性存疑"
    primary: "调查中状态 + 冻决"
    fallback: "强制人闸"
    writes: "decision_type=调查中; payout_ready=false"
  - route_id: R-HUMAN
    when: "拒赔草案、通融、预赔、超金额、Validator 失败升级、申诉回流"
    primary: "人闸队列"
    fallback: "无（硬闸）"
    writes: "human_latch_token"

routing_ledger_fields:
  - route_id
  - retrieval_profile
  - tool_acl_scope
  - decision_type
  - validator_score

