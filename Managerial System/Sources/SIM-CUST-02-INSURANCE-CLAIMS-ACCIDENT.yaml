### B3. 需求（收益、痛点）与 MoSCoW 排序
# -----------------------------------------------------------------------------

section: requirements_moscow
status: FILLED

requirements:
  - requirement_id: REQ-M-01
    moscow: Must
    title: "条款与批单版本化入库，裁决引用必须到条款项"
    pain: "拒赔/减赔说不清依据哪一款哪一版；消保与诉讼举证困难（对应保险法第24条说明理由义务）"
    benefit: "对外说明与对内审核同源可追溯"
    acceptance_hint: "任意拒赔/减赔草案均含 doc_id、条款项、doc_version/生效日、效力层级；缺失则不得进入对外通知状态"
    primary_stakeholders: [SH-04, SH-05, SH-02]
    related_clause_themes: [除外责任, 保险责任范围, 批单特别约定]
    notes: "公开司法与监管实践强调免责说明与拒赔理由；意外险常见除外含疾病导致、故意行为、约定高风险运动等"

  - requirement_id: REQ-M-02
    moscow: Must
    title: "材料齐全性断言 + 一次性补件清单"
    pain: "多次补件引发投诉，且可能违反保险法第22条「及时一次性通知」补正资料的要求"
    benefit: "提高材料一次交对率，缩短无效往返"
    acceptance_hint: "材料不齐时裁决类型=补件，清单一次给出且可追踪；禁止同一缺失项拆成多轮通知（系统层约束）"
    primary_stakeholders: [SH-03, SH-04, SH-02]
    related_clause_themes: [材料齐全性, 理赔申请资料]
    notes: |
      行业侧已将「理赔材料一次交对率」列为「好理赔」可量化指标讨论项
      （中国人民大学保险研究所《中国保险理赔数字化发展报告》发布场合，平安健康险等机构参与讨论）。
      代理平台公开案例称数字化后一次交对率可至约 90%；我司试点以内部基线提升为验收，不宣称达到某公司广告值。

  - requirement_id: REQ-M-03
    moscow: Must
    title: "意外险除外与「疾病 vs 意外」责任断言（带引用）"
    pain: "意外医疗案中疾病诱发摔伤、猝死争议等易错赔或不当拒赔；仅靠 OCR 字段无法完成责任认定"
    benefit: "争议点结构化呈给人审，减少骨干核赔遗漏关键除外"
    acceptance_hint: "命中除外或责任争议时必须引用除外条款项；不得仅输出「建议拒赔」无依据"
    primary_stakeholders: [SH-02, SH-03, SH-05]
    related_clause_themes: [除外责任, 意外定义, 保险责任]
    notes: "太平洋保险等公开科普亦归纳：疾病导致事故、主观故意、未承保高风险活动等属意外险常见不赔情形——试点要以本公司报备条款为准做断言，不以科普文代替条款"

  - requirement_id: REQ-M-04
    moscow: Must
    title: "免赔额与赔付比例计算断言"
    pain: "附加意外医疗的免赔额/赔付比例在规则引擎与条款间不一致，导致错赔或客诉"
    benefit: "理算口径与现行条款一致、可复核"
    acceptance_hint: "通赔/减赔草案展示免赔扣除与比例计算步骤，并引用对应条款；与条款冲突则失败关闭"
    primary_stakeholders: [SH-02, SH-03, SH-08]
    related_clause_themes: [免赔额, 比例赔付, 医疗费用补偿]
    notes: "免赔额/免赔率/比例赔付在保险法司法解释语境下可归入免除或减轻保险人责任条款范畴，说明与引用要求更高"

  - requirement_id: REQ-M-05
    moscow: Must
    title: "独立校验 + 失败关闭（不得自审自批结案）"
    pain: "历史「智能核赔」易变成规则自嗨；错案流入出款"
    benefit: "上线质量门禁，回归可重复"
    acceptance_hint: "Validator 独立检索条款并对 Golden 案件集打分；断言失败或引用覆盖不足不得标完成/不得进入出款就绪"
    primary_stakeholders: [SH-06, SH-02, SH-07]
    related_clause_themes: [质量门禁, 案件回归]
    notes: "对应我方 VP-INDEP-JUDGE / VP-FAIL-CLOSED；客户侧表述为内控要求"

  - requirement_id: REQ-M-06
    moscow: Must
    title: "分层人闸：拒赔/通融/超金额/调查结论必须人批"
    pain: "自动出款与对外拒赔风险极高；监管与内审零容忍越权"
    benefit: "效率提升但不转移持牌责任"
    acceptance_hint: |
      人闸三维：金额档 × 决定类型 × 场景。
      默认：对外拒赔、通融、预赔、调查结论解除冻决 → 人闸；
      超金额阈值通赔建议 → 人闸；纯补件可自动。
      无人闸令牌不得进入核心「同意给付/出款」状态。
    primary_stakeholders: [SH-02, SH-03, SH-06, SH-01]
    related_clause_themes: [人闸, 通融, 拒赔, 预赔]
    notes: "对齐保险法核定与给付程序；不把「无人最终拒赔」做成目标"

  - requirement_id: REQ-M-07
    moscow: Must
    title: "结构化裁决类型（补件/通赔建议/减赔/拒赔草案/调查中/预赔）"
    pain: "只有通过/拒绝两态，无法对接作业流与核心状态机"
    benefit: "与现有理赔系统状态对齐，可运营"
    acceptance_hint: "Worker 输出必须落在枚举类型；调查中自动冻决并阻断出款就绪"
    primary_stakeholders: [SH-03, SH-07, SH-09]
    related_clause_themes: [裁决类型, 欺诈调查]
    notes: "欺诈/虚假材料/事故真实性存疑是理赔数字化长期配套能力；公开核赔方案亦强调非正常赔付识别"

  - requirement_id: REQ-M-08
    moscow: Must
    title: "单险种薄切片试点范围锁定"
    pain: "若同时做车险定损+意健险+承保，集成与评价标准爆炸，项目失败"
    benefit: "可在一个季度内验收 ROI 与合规证据链"
    acceptance_hint: "范围书面锁定个人意外险（含附加意外医疗）理赔；其他险种仅调研不开发"
    primary_stakeholders: [SH-01, SH-07, SH-02]
    related_clause_themes: [试点范围]
    notes: "对齐行业「先标准化流程切片再扩展」的真实采购策略"

  - requirement_id: REQ-S-01
    moscow: Should
    title: "与理赔/核心/影像 L1 读 + L2 状态回写集成"
    pain: "系统外 Excel/邮件运转无法审计，也无法进入消保证据链"
    benefit: "门禁结果进入正式作业流"
    acceptance_hint: "可读案件、保单险别、条款代码、影像元数据；可回写补件清单、草案、门禁状态、人闸结果"
    primary_stakeholders: [SH-07, SH-03]
    related_clause_themes: [系统集成]
    notes: "L3 出款不进 Should 的强制项"

  - requirement_id: REQ-S-02
    moscow: Should
    title: "欺诈/异常线索触发「调查中」并冻款"
    pain: "重复索赔、发票疑点等若到出款前才发现，挽损成本高"
    benefit: "与现有规则引擎黑名单能力衔接，形成升级路径"
    acceptance_hint: "命中调查规则 → 裁决类型=调查中 + 冻决；仅调查岗/授权核赔可解除"
    primary_stakeholders: [SH-09, SH-06, SH-02]
    related_clause_themes: [欺诈, 调查中]
    notes: "公开智能核赔案例常强调非正常赔付识别；本需求是门禁联动而非新建反欺诈模型全集"

  - requirement_id: REQ-S-03
    moscow: Should
    title: "条款变更触发契约回归任务"
    pain: "产品改版后理赔侧无人触发回归，问题在投诉时才暴露"
    benefit: "手册/契约与条款同频"
    acceptance_hint: "新 doc_version 入库后自动开回归 Mission；未通过不得提高直通率"
    primary_stakeholders: [SH-08, SH-02, SH-07]
    related_clause_themes: [条款版本, 契约再生]
    notes: ""

  - requirement_id: REQ-S-04
    moscow: Should
    title: "试点 KPI 看板（模拟量级，对内管理）"
    pain: "只有技术指标，业务与消保看不到价值"
    benefit: "办公会可决策是否扩面"
    acceptance_hint: |
      至少跟踪：材料一次交对率、二次补件率、案均人审耗时（简单案）、
      拒赔可追溯率（抽检 citation 完整率）、人闸命中率、Golden 断言通过率。
      基线与目标见附录 outcome_targets：试点第 1–4 周必须用真实作业日志测定基线，再锁定目标；
      对外材料须标注非监管报送数；不得把头部公司公开广告值写成我司承诺。
    primary_stakeholders: [SH-01, SH-04, SH-02]
    related_clause_themes: [KPI]
    notes: |
      公开对标仅作压力来源：如国寿寿险 2024 年报口径整体赔付时效 0.34 天、智能化率超 70%；
      微保等平台披露一次交对率约 90%、OCR 准确度超 95%。我司目标不得直接抄袭为承诺值。
      「好理赔」公开讨论指标含：材料一次交对率、齐全到结案时效、平台理赔纠纷率、结案满意度。

  - requirement_id: REQ-S-05
    moscow: Should
    title: "Golden 案件集与分段回归（专家标注 + 周频）"
    pain: "无专家金标与分段评测时，试点只能靠 demo 一次说对，无法过内审/扩面"
    benefit: "上线门槛可客观验收；错案可回流"
    acceptance_hint: |
      见附录 golden_eval_spec：试点金标不少于约 300 件专家双审案件（分层抽样）；
      关键路径（补件一次清单、除外引用、免赔计算、批单效力冲突、拒赔 citation）断言通过率作为门禁；
      每周跑固定回归子集；人闸改正必须可回流进金标。
    primary_stakeholders: [SH-02, SH-06, SH-03]
    related_clause_themes: [Golden, 分段eval, 回归]
    notes: |
      依据公开实践：企业 AI 强调 gold-standard evaluation sets（专家标注、持续基准）；
      Snorkel 与 CPCU 专家共建保险承保 agent 基准并公开 Hugging Face 数据集，任务级准确率分化明显
      （其公开博客口径：如 Deductibles 任务均值约 0.784，Appetite Check 约 0.615 等）——
      说明垂直任务不能假设「前沿模型自然高分」，必须自建金标与分段门槛。
      Sixfold 等承保 AI 厂商亦公开将 accuracy benchmarks 作为 pilot 进入量产的前提。

  - requirement_id: REQ-S-06
    moscow: Should
    title: "核赔员端到端作业流（屏→动作→系统状态）"
    pain: "只有组织角色图，没有一线「打开什么、点什么、回写什么」，无法落地集成与培训"
    benefit: "与现有报案-立案-核赔-理算-结案链路对齐，降低变革阻力"
    acceptance_hint: "见附录 adjuster_workflow：每个关键屏有输入、系统动作、允许状态迁移与人闸点；Demo 必须按该路径走通一案"
    primary_stakeholders: [SH-03, SH-07, SH-02]
    related_clause_themes: [作业流, 状态机]
    notes: |
      人身/寿险理赔公开流程常见环节：报案、立案、受理/初审、调查、理算、复核审批、结案
      （行业百科与保司公开说明一致）；财险实务亦含签收审核单证、理算复核、审批、赔付结案。
      本试点映射到意外险个人险，不引入车险查勘定损主路径。

  - requirement_id: REQ-S-07
    moscow: Should
    title: "显式 Router：规则字段 / 条款 RAG / OCR / 调查规则分派"
    pain: "一律丢给大模型会把免赔算术与除外检索搅在一起，既慢又不可审计"
    benefit: "可编排流水线（先 Category-1），失败可定位到路由层"
    acceptance_hint: "见附录 router_table；每类请求有唯一主路由与回退；路由决策写入 ledger"
    primary_stakeholders: [SH-07, SH-02, SH-06]
    related_clause_themes: [Router, 编排]
    notes: "对齐「结构化规则 vs 非结构化条款 RAG」的行业落地常识与 Jason Liu 等公开的 query routing 实践"

  - requirement_id: REQ-C-01
    moscow: Could
    title: "核心 L3 直连出款/自动支付指令"
    pain: "端到端仍需核赔员在核心点「同意给付」"
    benefit: "极致时效"
    acceptance_hint: "若做，必须叠加人闸令牌 + 双人复核 + 可回滚；本阶段不作为验收必要条件"
    primary_stakeholders: [SH-07, SH-06]
    related_clause_themes: [出款]
    notes: "中型公司核心改造窗口有限；与「失败关闭」冲突风险高"

  - requirement_id: REQ-C-02
    moscow: Could
    title: "承保侧等待期/告知除外的只读提示（非本试点主路径）"
    pain: "部分纠纷源头在投保告知，理赔阶段被动背锅"
    benefit: "为二期 underwriting 门禁探路"
    acceptance_hint: "仅展示只读提示，不在本期做自动承保决策"
    primary_stakeholders: [SH-08, SH-02]
    related_clause_themes: [等待期, 投保告知]
    notes: "主垂直锁定 claims；本项 Could，防止范围回潮"

  - requirement_id: REQ-W-01
    moscow: Won't
    title: "健康/医疗诊断建议或治疗方案生成"
    pain: "越权医疗建议，监管与安全不可接受"
    benefit: "—"
    acceptance_hint: "需求说明书明确排除；评测集若出现诊疗建议视为缺陷"
    primary_stakeholders: [SH-05, SH-04]
    related_clause_themes: [安全边界]
    notes: "即使附加意外医疗涉及病历，也只做材料与条款门禁"

  - requirement_id: REQ-W-02
    moscow: Won't
    title: "无人最终拒赔且不可申诉/不可人工复核"
    pain: "直接违反消保与保险法说明义务精神，声誉与处罚风险"
    benefit: "—"
    acceptance_hint: "任何拒赔草案必须可驳回、可转人工、可申诉工单回流"
    primary_stakeholders: [SH-05, SH-04, SH-06]
    related_clause_themes: [拒赔, 申诉]
    notes: "任务硬约束"

  - requirement_id: REQ-W-03
    moscow: Won't
    title: "纯客服话术机器人作为本期交付"
    pain: "不解决条款裁决与审计"
    benefit: "—"
    acceptance_hint: "CX 话术不在本期范围"
    primary_stakeholders: [SH-02]
    related_clause_themes: []
    notes: ""

