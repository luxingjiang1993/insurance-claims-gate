# -----------------------------------------------------------------------------

section: industry_and_business_background
status: FILLED

industry:
  sector: insurance
  line_of_business: property_personal_accident   # 财险牌照下的意外险/短期意外医疗（非寿险公司重疾主业）
  primary_vertical_for_pilot: claims
  regulators_and_regimes:
    - "《中华人民共和国保险法》第22条：证明资料不完整时应及时一次性通知补正"
    - "《中华人民共和国保险法》第23条：及时核定；情形复杂的原则上三十日内核定；达成协议后十日内履行给付"
    - "《中华人民共和国保险法》第24条：不属于保险责任的，自核定之日起三日内发出拒赔通知书并说明理由"
    - "《中华人民共和国保险法》第26条：人寿保险以外其他保险请求给付时效一般为二年（自知道保险事故发生之日起）"
    - "国家金融监督管理总局《银行保险机构消费者权益保护管理办法》及消保监管评价（含金规〔2025〕20号《金融机构消费者权益保护监管评价办法》）"
    - "《中华人民共和国个人信息保护法》：病历、诊疗信息等敏感个人信息处理与最小化"
    - "条款报备/注册与互联网保险销售相关监管要求（意外险互联网专属条款常见）"
  company_type: "全国性中型财产保险公司总公司（合成画像；在十余个省市设分公司）"
  company_size_hint: |
    对标公开市场中非「龙头五家」的财险主体量级：个人意外险与短期意外医疗年报案量约数十万级；
    理赔作业以总公司规则+省级集中作业中心为主，地市机构负责协查与大额现场。
    （合成规模，用于试点范围估算，非真实保费披露。）

business_context:
  products_in_scope:
    - "个人意外伤害保险（主险）：意外身故/伤残"
    - "附加意外医疗保险：门急诊/住院医疗费用补偿（含免赔额与赔付比例）"
    - "试点条款集：已报备/注册的现行有效版本 + 有效批单/特别约定；不含重疾诊断给付、不含临床路径建议"
  current_systems:
    - "财产险核心业务系统（保单、批改、收付费）"
    - "理赔作业系统（立案、理算、核赔、结案）"
    - "影像/单证系统 + 第三方 OCR（发票、病历首页等结构化抽取，已上线数年）"
    - "规则引擎（金额权限、简易案件直通、黑名单/重复索赔初筛）"
    - "条款/产品文档库（PDF/Word；版本管理弱于核心险别代码）"
    - "银企支付/出款系统（仅核心触发；本试点不要求 Agent 直连出款）"
  policy_and_clause_lifecycle: |
    产品部与精算完成条款设计并完成监管报备/注册后上线；互联网渠道与银保渠道迭代快，
    特别约定与批单多。理赔手册与规则引擎条件由理赔管理部维护，常滞后于条款改版 1–2 个迭代。
    一线核赔员实际「夹缝作业」：一边看 PDF 条款，一边点规则引擎结果，拒赔话术另存话术库，
    三者不一致时，消保投诉与诉讼举证成本陡增。
  document_types_in_play:
    - "主险/附加险条款 PDF（含责任免除加粗页）"
    - "保险单与批单、特别约定"
    - "理赔申请书、身份证明、银行卡信息"
    - "门急诊病历/出院小结、费用发票与费用清单、医保结算单"
    - "意外经过说明、交通事故认定书（如有）、伤残鉴定报告（伤残案件）"
    - "公司理赔作业手册与材料清单（对内）"
  recent_trigger: |
    1) 消保与投诉侧：客户对「多次补件」与「拒赔说不清条款依据」投诉占比上升；法务复核发现
       部分拒赔通知引用的是旧版除外表述或仅有话术库句子、无条款项级出处——直接触及保险法
       第22条一次性通知补正与第24条说明理由义务。
    2) 内外部对标压力：行业公开报道显示头部公司小额理赔已做到极短时效、智能化审核比例高
       （如中国人寿寿险公开披露 2024 年智能化审核赔案超 1700 万件、智能化率超 70%，整体赔付时效 0.34 天），
       抬高客户对「秒赔/快赔」预期；我司 OCR 与规则直通已有，但「条款一致性裁决」仍靠人工，
       复杂意外医疗（疾病vs意外争议）排队拉长，拖累消保评价观感。
    3) 内审抽样：规则引擎「免赔额/比例」与现行附加险条款不一致的个案；手册未同步批单特别约定。
    4) 监管评价语境：金融监管总局持续强化消保监管评价（金规〔2025〕20号等），理赔可解释性与
       材料一次性交对齐成为可被抽查的证据链问题，而非纯 IT 效率项目。
  constraints:
    compliance:
      - "拒赔/减赔对外文书必须能追溯到有效条款版本与条款项；禁止不可申诉的自动终局拒赔"
      - "补件通知应符合「一次性告知」要求，系统需固化必传清单，避免反复索要"
      - "病历等敏感个人信息最小化、脱敏与访问审计；试点数据不出境"
      - "自动化辅助决策需可人工复核；持牌核赔责任不因 AI 草案而转移"
      - "通融赔付必须走权限人闸，不得伪装成条款通赔引用"
    technical:
      - "已有 OCR/规则引擎，本项目增量是条款版本化 RAG + 验收契约 + 独立校验，不重复建设 OCR"
      - "试点仅 L1 读案件/保单/影像元数据 + L2 回写补件清单与裁决草案/门禁状态；L3 出款仍由核心人工或既有支付流程触发"
      - "Worker 禁止直连生产支付；写权限需 ACL、灰度与可回滚"
      - "峰值（节假日出行意外、暑期等）允许降级为补件清单+排队人审，禁止静默自动通赔"
    organizational:
      - "总公司理赔管理部定规则与人闸阈值；省分作业中心执行；产品/精算负责条款版本权威源"
      - "IT 与核心厂商协调窗口有限，试点必须薄切片，避免「全险种改造」立项失败"
      - "调查岗/公估外包案件走「调查中」状态，冻结自动裁决"

narrative_overview: |
  我们是一家中型财产险总公司。试点锁定「个人意外伤害险 + 附加意外医疗」理赔，而不是车险定损或重疾诊断。
  行业已经证明 OCR 和线上化能把材料识别做上去（公开案例中，代理平台侧曾披露 OCR 覆盖六十余类材料、
  识别准确度超 95%、材料一次交对率提升至约 90%），头部寿险也公开了较高的智能化审核比例与极短整体时效。
  我们的真实缺口不在「能不能把发票读出来」，而在：读完之后，是否按【现行有效条款 + 批单效力栈】完成
  材料齐全、除外责任（尤其是疾病导致伤害、高风险运动、故意行为等意外险常见除外）、免赔与比例赔付的
  可验收断言；以及拒赔/减赔能否在法定时限内给出带条款引用的说明，并保留申诉回人工路径。

  因此我们要的不是理赔聊天机器人，而是「条款/手册 → 验收契约 → 抽取与裁决草案 → 独立校验 → 分层人闸」
  的门禁中继。成功标准是：补件一次说清、裁决类型结构化、引用可审计、校验失败不得结案出款、
  对外拒赔与超权限给付必须人批。

