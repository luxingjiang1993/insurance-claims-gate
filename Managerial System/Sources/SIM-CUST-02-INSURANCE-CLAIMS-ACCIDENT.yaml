  Must:
    - REQ-M-01
    - REQ-M-02
    - REQ-M-03
    - REQ-M-04
    - REQ-M-05
    - REQ-M-06
    - REQ-M-07
    - REQ-M-08
  Should:
    - REQ-S-01
    - REQ-S-02
    - REQ-S-03
    - REQ-S-04
    - REQ-S-05
    - REQ-S-06
    - REQ-S-07
  Could:
    - REQ-C-01
    - REQ-C-02
  Wont:
    - REQ-W-01
    - REQ-W-02
    - REQ-W-03
  ranking_rationale: |
    排序依据：(1) 法定义务与消保评价证据链（一次性补件、拒赔说明理由、可审计引用）优先于体验花活；
    (2) 错赔/不当拒赔与越权出款的尾部风险优先于平均时效；
    (3) 可验收性：材料断言、免赔计算、除外引用、独立校验均可做 Golden 集，优于不可测的「更智能」；
    (4) 组织可交付：先锁意外险薄切片与 L1/L2，避免 L3 出款拖垮中型公司 IT 排期；
    (5) 明确 Won't，防止销售/厂商把诊断 Agent 或不可申诉自动拒赔塞进范围；
    (6) v2 将 Golden/作业流/Router/outcome 列为 Should：不改变 Must 合规底线，但作为 design partner 扩面前置条件。

