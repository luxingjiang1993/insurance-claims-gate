[pytest]
# 默认 CI 只跑轨 A；轨 B / eval 旁路 / Assist 质量 S2 / 真 LLM / LangSmith 失败不阻断合门禁
addopts = -m "not track_llm_optional and not eval_bypass and not requires_llm and not langsmith_integration and not assist_quality"
markers =
    track_llm_optional: 轨 B llm_optional 隔离测试；不得并入默认 CI / Demo 绿门
    eval_bypass: Eval 负例旁路；不替代 machine_check，不得并入默认合门禁主缝
    requires_llm: 真 OpenAI-compatible 调用；缺 Key 时跳过，不得并入默认 CI
    langsmith_integration: 真 LangSmith 上报或官方 mock 策略；缺 Key 时跳过；不得冒充 Pilot Complete / 不得替代 machine_check
    assist_quality: Assist 质量 S2（冻结集 Recall/MRR、三维质量旁路等）；nightly 旁路；不得并入默认合门禁
